# Değişkenler: proje kökündeki .env (bkz. .env.template)
# DATABASE_URL: POSTGRES_* ile compose içinde üretilir (çift tanım yok).

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB .env}
  REDIS_URL: ${REDIS_URL:?REDIS_URL .env içinde gerekli}
  UPLOAD_DIR: ${UPLOAD_DIR:?UPLOAD_DIR .env içinde gerekli}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:?EMBEDDING_MODEL .env içinde gerekli}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:?EMBEDDING_DIMENSION .env içinde gerekli}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:?MAX_UPLOAD_MB .env içinde gerekli}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS .env içinde gerekli}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER .env içinde gerekli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde gerekli}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB .env içinde gerekli}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT .env içinde gerekli}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-5s}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-3}

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:?REDIS_PORT .env içinde gerekli}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${REDIS_HEALTHCHECK_INTERVAL:-5s}
      timeout: ${REDIS_HEALTHCHECK_TIMEOUT:-2s}
      retries: ${REDIS_HEALTHCHECK_RETRIES:-3}

  migrate:
    build: .
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/scripts/docker-migrate.sh"]
    restart: "no"

  api:
    build: .
    ports:
      - "${API_PORT:?API_PORT .env içinde gerekli}:8000"
    environment:
      <<: *app-env
    volumes:
      - uploads:/data/uploads
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: .
    environment:
      <<: *app-env
    volumes:
      - uploads:/data/uploads
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["arq", "app.workers.settings.WorkerSettings"]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL .env içinde gerekli}
    ports:
      - "${WEB_PORT:?WEB_PORT .env içinde gerekli}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  uploads:
  hf_cache:
